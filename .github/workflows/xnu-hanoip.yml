name: iOS kernel for Moto G60 (hanoip)

# Based on ios-sweet's xnu.yml (MIT, dipa-studio). Two jobs:
#  1. patch-check (Linux, ~3 min): every port patch must apply to a clean
#     xnu-8796.141.3. dxb's build.sh only WARNS on a failing patch and keeps
#     building, so a broken patch would otherwise go unnoticed.
#  2. build (macOS, long): compiles the XNU kernel with all patches.

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: Also run the long macOS kernel build
        default: "true"
  push:
    paths:
      - "ios-hanoip/xnu/patches/**"
      - "ios-hanoip/tools/check-patches.sh"
      - ".github/workflows/xnu-hanoip.yml"

concurrency:
  group: xnu-hanoip-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  XNU_TAG: xnu-8796.141.3
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET

jobs:
  patch-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch xnu and dxb
        run: |
          git clone -q --depth 1 --branch "$XNU_TAG" https://github.com/apple-oss-distributions/xnu.git xnu-base
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
      - name: Apply every patch strictly
        run: bash ios-hanoip/tools/check-patches.sh "$PWD/ios-hanoip" "$PWD/xnu-base" "$PWD/dxb" "$RUNNER_TEMP/work"
      - name: Repository checks
        working-directory: ios-hanoip
        run: python3 tools/validate-repo.py

  build:
    needs: patch-check
    if: github.event_name == 'push' || inputs.build_kernel != 'false'
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp ios-hanoip/xnu/patches/*.patch ios-hanoip/xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: -k
        run: bash build.sh 2>&1 | tee ../build.log

      - name: Fail on skipped port patches or compile errors
        if: always()
        run: |
          if grep -E "Skipping patch .*/[0-9]{4}-" build.log; then
            echo "::error::a port patch was skipped"; exit 1
          fi
          grep -nE " error: " build.log | head -40 || true
          ls dxb/fakeroot/System/Library/Kernels/kernel.* || { echo "::error::no kernel produced"; exit 1; }

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          cp build.log out/
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-hanoip
          path: out/
          if-no-files-found: warn
